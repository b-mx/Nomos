[project]
name = "nomos-tools"
version = "0.1.0"
description = "Validation and index-generation tooling for the Nomos vendor/product identity mapping"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "rapidfuzz==3.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "types-pyyaml==6.0.12.20260815",
    "types-jsonschema==4.26.0.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
# .claude/worktrees/** holds full nested checkouts of this repo (used for
# isolated agent work) — without this, a bare `pytest` run from the repo
# root also recurses into them and re-collects the same tmp/scripts/ test
# files a second time via their tmp/ -> ../../../tmp symlink back to this
# checkout, which can crash collection depending on invocation cwd.
norecursedirs = [".claude", ".git", ".venv"]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
