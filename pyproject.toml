[project]
name = "nomos-tools"
version = "0.1.0"
description = "Validation and index-generation tooling for the Nomos vendor/product identity mapping"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "rapidfuzz==3.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "types-pyyaml==6.0.12.20260815",
    "types-jsonschema==4.26.0.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
