name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy --strict tools
      - run: uv run pytest
      - run: uv run tools/validate.py
      - name: Check data/examples/ is up to date with data/vendors/
        run: |
          generated_at=$(python3 -c "import json; print(json.load(open('data/examples/aliases.json'))['generated_at'])")
          uv run tools/build_index.py --output-dir /tmp/examples-check --generated-at "$generated_at"
          diff -r data/examples /tmp/examples-check
