name: Publish Index

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: uv sync --all-extras
      - run: uv run tools/validate.py
      - name: Build index
        run: uv run tools/build_index.py --output-dir dist/index --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Build Pagefind search index
        run: |
          cd site && npm ci
          node build-pagefind.mjs --index ../dist/index/aliases.json --output ../dist/pagefind
      - name: Assemble Pages site
        run: |
          mkdir -p dist
          cp site/index.html site/search.html site/style.css site/search.js site/landing.js dist/
          cp docs/nomos-banner.svg dist/
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
