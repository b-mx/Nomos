name: Publish Index

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: uv sync --all-extras
      - run: uv run tools/validate.py
      - name: Build index
        run: uv run tools/build_index.py --output-dir dist/index --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Build Pagefind search index
        run: |
          cd site && npm ci
          node build-pagefind.mjs --index ../dist/index/aliases.json --output ../dist/pagefind
      - name: Assemble Pages site
        run: |
          mkdir -p dist
          cp site/index.html site/search.html site/style.css site/search.js site/landing.js site/theme.js site/favicon.svg dist/
          cp docs/nomos-banner.svg dist/
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
